protocols = imap
listen = *
log_path = /dev/stderr
info_log_path = /dev/stdout
ssl = required
ssl_cert = </certs/server.crt
ssl_key = </certs/server.key
auth_mechanisms = plain login
disable_plaintext_auth = yes
mail_location = maildir:~/Maildir
mail_max_userip_connections = 10
first_valid_uid = 1000
passdb {
  driver = static
  args = password=soak-password
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/vmail/%u
}
namespace inbox {
  inbox = yes
  mailbox Trash {
    auto = create
    special_use = \Trash
  }
  mailbox Sent {
    auto = create
    special_use = \Sent
  }
  mailbox Archive {
    auto = create
    special_use = \Archive
  }
}
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  process_min_avail = 4
  process_limit = 128
  client_limit = 256
  service_count = 0
}
service imap {
  process_limit = 2048
}
service stats {
  client_limit = 4096
}
service auth {
  client_limit = 4096
}
service anvil {
  client_limit = 4096
}
